[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-article-rpa"
version = "0.2.0"
description = "Windows 11 微信公众号资料页池与文章采集 Agent"
requires-python = ">=3.10,<3.13"
dependencies = [
  "Pillow>=11.0,<13",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "pymongo>=4.10,<5",
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "onnxruntime==1.20.1",
  "rapidocr-onnxruntime==1.4.4",
  "pyperclip>=1.9,<2",
  "tzdata>=2024.1",
]

[project.scripts]
wechat-rpa = "wechat_rpa.runtime.collector_runtime:main"
wechat-rpa-control-panel = "wechat_rpa.runtime.control_panel_runtime:main"
wechat-rpa-vision-smoke = "wechat_rpa.cli.vision_smoke:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
